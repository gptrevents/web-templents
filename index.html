<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPTR Templates</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        main {
            padding: 4rem 2rem;
            width: 100%;
            max-width: 1200px;
        }
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .template-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            background-color: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .card-image {
            height: 200px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card-content {
            padding: 1.5rem;
        }
        .card-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .card-description {
            margin: 0;
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>GPTR Templates</h1>
    </header>
    <main>
        <div class="templates-grid">
            <a href="templates/traditional-invitation/index.html" class="template-card">
                <div class="card-image">
                    💌
                </div>
                <div class="card-content">
                    <h2 class="card-title">Traditional Invitation</h2>
                    <p class="card-description">A beautiful traditional wedding invitation template with animations and elegant design.</p>
                </div>
            </a>
            <a href="templates/vijay-rashmika-invitation/index.html" class="template-card">
                <div class="card-image">
                    ✨
                </div>
                <div class="card-content">
                    <h2 class="card-title">Vijay & Rashmika Wedding</h2>
                    <p class="card-description">A modern and elegant wedding invitation template perfect for contemporary weddings.</p>
                </div>
            </a>
            <!-- Future templates will be added here -->
        </div>
    </main>
</body>
</html>
